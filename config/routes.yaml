status:
    path: /api/status
    controller: App\Controller\StatusController::status
    method: GET
    description: Check if application is online
    requestDto: null
    status_code: 200

info:
    path: /api/info
    controller: App\Controller\StatusController::info
    method: GET
    description: Get application information dump
    requestDto: null
    status_code: 200

get_all_data:
    path: /api/get_data
    controller: App\Controller\DataController::getAllData
    method: GET
    description: Get all data from the GTFS-RT endpoint
    requestDto: null
    status_code: 200

get_vehicles:
    path: /api/vehicles
    controller: App\Controller\DataController::getAllVehicles
    method: GET
    description: Get all vehicle entities
    requestDto: null
    status_code: 200

get_trip_updates:
    path: /api/trip_updates
    controller: App\Controller\DataController::getAllTripUpdates
    method: GET
    description: Get all trip updates
    requestDto: null
    status_code: 200

get_alerts:
    path: /api/alerts
    controller: App\Controller\DataController::getAllAlerts
    method: GET
    description: Get all alerts
    requestDto: null
    status_code: 200

route_geography:
    path: /api/route/{routeId}/geography
    controller: App\Controller\RouteGeographyController::getRouteGeography
    method: GET
    description: Get route geography for a specific route
    requestDto: null
    status_code: 200

