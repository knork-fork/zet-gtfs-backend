map $http_user_agent $is_embed_crawler {
    default 0;
    ~*googlebot 0;
    ~*bingbot 0;
    ~*duckduckbot 0;
    ~*discordbot 1;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*slackbot 1;
    ~*linkedinbot 1;
    ~*telegrambot 1;
}

upstream php_external {
    # add more containers to load balance between them if needed
    server zet-gtfs-php-api:9000;
}

upstream php_internal {
    server zet-gtfs-php-fetcher:9000;
}

# public facing webserver (static files and php-api)
# available from outside on http://localhost:80
server {
    listen 80 default;
    server_name _;

    client_max_body_size 108M;

    # Don't allow direct access to arbitrary *.php paths
    location ~ \.php$ { return 404; }

    access_log /var/log/nginx/application.access.log;
    error_log /var/log/nginx/application.error.log;

    root /application/public;
    index index.php;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

    #### Static files (SEO friendly)
    location = /sitemap.xml { try_files /static/sitemap.xml =404; }
    location = /robots.txt { try_files /static/robots.txt =404; }

    location = /about {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }

        alias /application/public/static/about/index.html;
        default_type text/html;
    }

    location ^~ /about/ {
        alias /application/public/static/about/;
        try_files $uri =404;
    }

    location = /about.en {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }

        alias /application/public/static/about.en/index.html;
        default_type text/html;
    }

    location ^~ /about.en/ {
        alias /application/public/static/about.en/;
        try_files $uri =404;
    }
    #### Static files (SEO friendly)

    # Embed handling:
    # - crawlers => serve static embed (/application/public/static/about/embed-root.1.html)
    # - humans   => proxy to Vite SPA
    location = / {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }
        
        proxy_pass http://vue-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Forward frontend requests to Vite server
    location / {
        proxy_pass http://vue-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle stops endpoint in an optimized way
    location /api/stops {
        alias /data/gtfs/generated_stops/stops.json;
        add_header Content-Type application/json;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

        gzip_static on;
    }

    # # Forward /api requests to php-api
    location ^~ /api/ {
        try_files $uri @api_front_controller;
    }

    location @api_front_controller {
        include fastcgi_params;
        fastcgi_pass php_external;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}

# php-fetcher, not accessible from outside
# available to docker network as http://zet-gtfs-webserver:8081
server {
    listen 8081 default;
    server_name _;

    client_max_body_size 108M;

    # Don't allow direct access to arbitrary *.php paths
    location ~ \.php$ { return 404; }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /application/public/index.php;
        fastcgi_param DOCUMENT_ROOT /application/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass php_internal;
    }
}