services:
    postgres:
        container_name: zet-gtfs-postgres
        restart: unless-stopped
        image: 'postgres:15-alpine'
        working_dir: /application
        volumes:
            - zet-gtfs-pgdata:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=zetgtfs_user
            - POSTGRES_PASSWORD=zetgtfs_pass
            - POSTGRES_DB=zetgtfs_db

    pgbouncer:
        container_name: zet-gtfs-db
        depends_on: 
            - postgres
        restart: unless-stopped
        image: edoburu/pgbouncer:latest
        environment:
            DB_USER: zetgtfs_user
            DB_PASSWORD: zetgtfs_pass
            DB_HOST: zet-gtfs-postgres
            DATABASES: |
                zetgtfs_db = host=zet-gtfs-postgres dbname=zetgtfs_db
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 100
            DEFAULT_POOL_SIZE: 20
            LISTEN_PORT: 5435
        volumes:
            - ./containers/common/config/pgbouncer/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro

    webserver:
        container_name: zet-gtfs-webserver
        restart: unless-stopped
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - './containers/webserver:/application'
            - './static_data:/data/gtfs'
            - './containers/common/config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
            - './var/logs/nginx:/var/log/nginx'
        ports:
            - '20000:80'

    php-api:
        container_name: zet-gtfs-php-api
        restart: unless-stopped
        build:
            context: containers/common/images/php-api
            dockerfile: Dockerfile
        working_dir: /application
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - './containers/php-api:/application'
            - './containers/common/config/php-fpm/php-ini-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini'
            - './containers/common/config/php-fpm/php-ini-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini'
            - './var/logs/php-api:/var/log'
    
    php-fetcher:
        container_name: zet-gtfs-php-fetcher
        restart: unless-stopped
        build:
            context: containers/common/images/php-fetcher
            dockerfile: Dockerfile
        working_dir: /application
        volumes:
            - './containers/php-fetcher:/application'
            - './containers/common/config/php-fpm/php-ini-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini'
            - './containers/common/config/php-fpm/php-ini-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini'
            - './var/logs/php-fetcher:/var/log'

    vue-frontend:
        container_name: zet-gtfs-vue-frontend
        restart: unless-stopped
        image: node:20-alpine
        working_dir: /application
        volumes:
            - './containers/frontend:/application'
        command: sh -c "npm install && npm run dev -- --host"

volumes:
    zet-gtfs-pgdata:
