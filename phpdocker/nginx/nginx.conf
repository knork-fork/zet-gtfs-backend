map $http_user_agent $is_embed_crawler {
    default 0;
    ~*googlebot 0;
    ~*bingbot 0;
    ~*duckduckbot 0;
    ~*discordbot 1;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*slackbot 1;
    ~*linkedinbot 1;
    ~*telegrambot 1;
}

server {
    listen 80 default;

    client_max_body_size 108M;

    access_log /var/log/nginx/application.access.log;

    root /application/public;
    index index.php;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

    #### Static files (SEO friendly)
    location = /sitemap.xml { try_files /static/sitemap.xml =404; }
    location = /robots.txt { try_files /static/robots.txt =404; }

    location = /about {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }

        alias /application/public/static/about/index.html;
        default_type text/html;
    }

    location ^~ /about/ {
        alias /application/public/static/about/;
        try_files $uri =404;
    }

    location = /about.en {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }

        alias /application/public/static/about.en/index.html;
        default_type text/html;
    }

    location ^~ /about.en/ {
        alias /application/public/static/about.en/;
        try_files $uri =404;
    }
    #### Static files (SEO friendly)

    # Admin panel
    location ^~ /admin {
        resolver 127.0.0.11 valid=30s;
        set $admin http://admin:3000;
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Embed handling:
    # - crawlers => serve static embed (/application/public/static/about/embed-root.1.html)
    # - humans   => proxy to Vite SPA
    location = / {
        if ($is_embed_crawler) {
            rewrite ^ /about/embed-root.1.html last;
        }
        
        proxy_pass http://vue-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Forward frontend requests to Vite server
    location / {
        proxy_pass http://vue-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle stops endpoint in an optimized way
    location /api/stops {
        alias /application/scripts/gtfs/generated_stops/stops.json;
        add_header Content-Type application/json;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';

        gzip_static on;
    }

    # Forward /api requests to php-fpm
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /index.php?/$1 last;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404; # Ensure the file actually exists before passing it to PHP-FPM
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}
